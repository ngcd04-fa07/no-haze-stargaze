name: Update Restricted-Access Flags

# Monthly re-check of gostargazing.co.uk's own private-location notice for every
# known site. Cheaper than a full scrape since it skips sitemap discovery and
# only merges the restricted_access field — see scripts/refresh_sites_cache.py.
# Observed runtime: ~16 min for ~2650 sites.
#
# Runs SECOND in the monthly sequence (06:00 UTC), after Full Site Scrape
# (00:00 UTC, so this operates on the freshest site list including any newly
# -discovered sites) and before Amenity Scrape (12:00 UTC). 6h gaps rather
# than 4h since GitHub Actions cron can run 2-3h late under load.
# First scheduled run: 1 August 2026.

on:
  schedule:
    - cron: '0 6 1 * *'   # 06:00 UTC on the 1st of every month
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh restricted-access flags
        run: python scripts/refresh_sites_cache.py --mode restricted

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "ng.nilaygupta04@gmail.com"
          cp sites_cache.json /tmp/sites_cache_fresh.json
          git pull --rebase --autostash origin main
          git stash drop 2>/dev/null || true
          cp /tmp/sites_cache_fresh.json sites_cache.json
          git add sites_cache.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update restricted-access flags $(date -u '+%Y-%m-%d %H:%M') UTC"
            git push origin main || (git pull --rebase -X ours origin main && git push origin main)
          fi
