name: Refresh Forecast Cache

# Targets 06:00, 14:00, 22:00 BST — midway between Windows runs (02:00, 10:00, 18:00 BST).
# GitHub Actions crons run ~2-3h late in practice, so crons are set 2h early (03:00,
# 11:00, 19:00 UTC) to compensate and land closer to the intended spacing.
# GitHub Actions uses a different IP than the Windows machine = separate Open-Meteo quota.
#
# Note: cron times are UTC. In winter (GMT) these fire 1 hour earlier BST-equivalent.

on:
  schedule:
    - cron: '0 3 * * *'    # targets ~06:00 BST (03:00 UTC + ~2.5h delay)
    - cron: '0 11 * * *'   # targets ~14:00 BST (11:00 UTC + ~2.5h delay)
    - cron: '0 19 * * *'   # targets ~22:00 BST (19:00 UTC + ~2.5h delay)
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh forecast cache
        run: python scripts/refresh_forecast_cache.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "ng.nilaygupta04@gmail.com"
          # Save fresh data before pull — a concurrent Windows push during our sweep
          # can cause an autostash conflict that corrupts forecast_cache.json.
          cp forecast_cache.json /tmp/forecast_cache_fresh.json
          git pull --rebase --autostash origin main
          git stash drop 2>/dev/null || true
          cp /tmp/forecast_cache_fresh.json forecast_cache.json
          git add forecast_cache.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update forecast cache $(date -u '+%Y-%m-%d %H:%M') UTC"
            # Retry once if a concurrent push lands between our pull and push.
            # -X ours keeps our freshly generated data on conflict.
            git push origin main || (git pull --rebase -X ours origin main && git push origin main)
          fi
