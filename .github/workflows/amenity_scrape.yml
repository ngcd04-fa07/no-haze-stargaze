name: Amenity Scrape

# Monthly full amenity sweep: queries OpenStreetMap's Overpass API for
# parking/toilets/street lighting near every cached site (see
# scripts/refresh_amenities.py). Replaces the old per-request reactive fetch
# that used to run inline from live user searches on Render (whose ephemeral
# disk lost the accumulated data on every deploy).
#
# Runs LAST in the monthly sequence (12:00 UTC), after Full Site Scrape
# (00:00 UTC) and Update Restricted-Access Flags (06:00 UTC) — both fast
# (~11 min / ~16 min), so this gets the full 12h runway before the next
# day starts, and operates on the freshest + most complete site list rather
# than racing the other two for write access to sites_cache.json.
# First scheduled run: 1 August 2026.
#
# Single-threaded and paced at ~1.2s/site to stay respectful of the free
# public Overpass instance. Observed runtime: ~5 hours for ~2650 sites —
# real Overpass round-trip latency dominates over the deliberate per-site
# delay, so this is much slower than the delay alone would suggest.

on:
  schedule:
    - cron: '0 12 1 * *'   # 12:00 UTC on the 1st of every month
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Full amenity sweep
        run: python scripts/refresh_amenities.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "ng.nilaygupta04@gmail.com"
          cp sites_cache.json /tmp/sites_cache_fresh.json
          git pull --rebase --autostash origin main
          git stash drop 2>/dev/null || true
          cp /tmp/sites_cache_fresh.json sites_cache.json
          git add sites_cache.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update site amenities $(date -u '+%Y-%m-%d %H:%M') UTC"
            git push origin main || (git pull --rebase -X ours origin main && git push origin main)
          fi
